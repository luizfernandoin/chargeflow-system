spring.application.name=charge-manager
server.port=8081

spring.datasource.url=jdbc:postgresql://postgres:5432/chargerdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

logging.level.root=INFO
logging.level.com.dac=DEBUG
logging.level.org.springframework.web=DEBUG

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

proxy.soap.url=${PROXY_SOAP_URL:http://charge-proxy:8080/ws}

# Email Configuration - Development
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:seu-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:sua-senha}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from=${MAIL_USERNAME:seu-email@gmail.com}
app.mail.enabled=true