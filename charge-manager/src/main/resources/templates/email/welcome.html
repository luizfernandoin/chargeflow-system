<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; background: #f9f9f9; }
        .header { background: #007bff; color: white; padding: 20px; border-radius: 5px; }
        .content { background: white; padding: 20px; margin-top: 20px; border-radius: 5px; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Bem-vindo ao Gerenciador de Cobranças!</h1>
        </div>
        <div class="content">
            <p>Olá <strong th:text="${client.name}"></strong>,</p>
            <p>Seu cadastro foi realizado com sucesso! Agora você pode gerenciar suas cobranças de forma simples e eficiente.</p>
            <p><strong>Seus dados:</strong></p>
            <ul>
                <li th:text="'Nome: ' + ${client.name}"></li>
                <li th:text="'Email: ' + ${client.email}"></li>
                <li th:text="'CPF/CNPJ: ' + ${client.cpfCnpj}"></li>
            </ul>
            <p>Qualquer dúvida, entre em contato com nosso suporte.</p>
        </div>
        <div class="footer">
            <p>© 2026 Gerenciador de Cobranças. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
