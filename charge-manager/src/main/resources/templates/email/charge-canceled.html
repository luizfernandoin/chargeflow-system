<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; background: #f9f9f9; }
        .header { background: #dc3545; color: white; padding: 20px; border-radius: 5px; }
        .content { background: white; padding: 20px; margin-top: 20px; border-radius: 5px; }
        .info-box { background: #f8d7da; padding: 15px; border-left: 4px solid #dc3545; margin: 15px 0; }
        .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Cobrança Cancelada</h1>
        </div>
        <div class="content">
            <p th:text="'Olá ' + ${charge.client.name} + ','"></p>
            <p>Informamos que uma cobrança foi cancelada.</p>
            <div class="info-box">
                <p th:text="'ID da Cobrança: ' + ${charge.id}"></p>
                <p th:text="'Valor: R$ ' + ${#numbers.formatDecimal(charge.value, 1, 2)}"></p>
                <p>Status: Cancelada</p>
            </div>
            <p>Se você tem dúvidas sobre este cancelamento, entre em contato conosco.</p>
        </div>
        <div class="footer">
            <p>© 2026 Gerenciador de Cobranças. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
